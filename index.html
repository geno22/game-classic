<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกมดนตรีคลาสสิก · Classical Music Games (Offline)</title>
<meta name="description" content="เกมทายศัพท์ดนตรี อักษรไขว้ และทายนักประพันธ์ — ไฟล์เดียว เล่นออฟไลน์ได้">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Serif+Thai:wght@400;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d9b87f;--gold-bright:#f0d8a8;--gold-deep:#a9854d}
html{-webkit-text-size-adjust:100%}
body{
  background:#120e0b;color:#f0e5d2;line-height:1.55;
  font-family:'Sarabun','Noto Serif Thai',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
a{color:inherit}
.app-shell{
  position:relative;min-height:100vh;background-color:#120e0b;
  background-image:
    radial-gradient(ellipse 90% 55% at 50% -15%, rgba(217,184,127,.16), transparent 65%),
    radial-gradient(ellipse 70% 45% at 50% 118%, rgba(126,72,52,.14), transparent 70%);
}
.wrap{position:relative;max-width:1040px;margin:0 auto;padding:38px 16px 80px}
.center{text-align:center}
.muted{color:#a9977f}
.small{font-size:.85rem}
.gold-text{color:var(--gold)}
.right-text{color:#a8c9a4}
.wrong-text{color:#e7a29c}
.hidden{display:none!important}
.mt1{margin-top:.3rem}.mt2{margin-top:.5rem}.mt3{margin-top:.75rem}
.mt4{margin-top:1rem}.mt5{margin-top:1.25rem}.mt7{margin-top:1.75rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.stack>*+*{margin-top:.5rem}
.display-title{
  font-family:'Cormorant Garamond','Noto Serif Thai',Georgia,serif;
  font-weight:600;line-height:1.15;color:#f5ead6;
}
.eyebrow{
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);
}
.term{
  font-family:'Cormorant Garamond','Noto Serif Thai',Georgia,serif;
  font-style:italic;font-size:1.75rem;line-height:1.2;color:var(--gold-bright);
}
.ornate-panel{
  position:relative;border:1px solid rgba(217,184,127,.18);border-radius:3px;
  background:linear-gradient(180deg, rgba(217,184,127,.055), rgba(217,184,127,0) 42%), #1a1410;
  box-shadow:0 50px 90px -60px #000, inset 0 1px 0 rgba(255,245,225,.05);
}
.ornate-panel::before{
  content:"";position:absolute;inset:5px;border:1px solid rgba(217,184,127,.09);
  border-radius:2px;pointer-events:none;
}
.panel-pad{padding:18px}
@media(min-width:640px){.panel-pad{padding:30px}}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;margin:18px auto}
.rule::before,.rule::after{
  content:"";height:1px;flex:1 1 auto;
  background:linear-gradient(90deg, rgba(217,184,127,0), rgba(217,184,127,.5), rgba(217,184,127,0));
}
.rule span{width:7px;height:7px;flex:none;transform:rotate(45deg);border:1px solid rgba(217,184,127,.75)}
.tab{
  display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.05rem;
  border:1px solid rgba(217,184,127,.18);border-radius:2px;background:rgba(255,246,230,.02);
  color:#e6d8c1;font-size:.9rem;cursor:pointer;transition:all .22s ease;
}
.tab:hover{border-color:rgba(217,184,127,.45);background:rgba(217,184,127,.06);color:#f7edda}
.tab.is-active{
  background:linear-gradient(180deg,#e8cc9a,#c9a765);border-color:rgba(255,242,214,.55);
  color:#241a10;font-weight:600;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.62rem 1.15rem;border-radius:2px;border:1px solid transparent;
  font-size:.93rem;line-height:1.2;cursor:pointer;transition:all .2s ease;
}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn-gold{
  background:linear-gradient(180deg,#ebd0a0,#cba765);border-color:rgba(255,242,214,.5);
  color:#231a10;font-weight:600;
}
.btn-gold:hover:not(:disabled){filter:brightness(1.05)}
.btn-ghost{background:rgba(255,246,230,.015);border-color:rgba(217,184,127,.26);color:#e9dcc7}
.btn-ghost:hover:not(:disabled){border-color:rgba(217,184,127,.6);background:rgba(217,184,127,.07)}
.btn-sm{padding:.34rem .75rem;font-size:.79rem}
.tag{
  display:inline-flex;align-items:center;gap:.35rem;padding:.18rem .7rem;border-radius:999px;
  border:1px solid;font-size:.76rem;font-weight:600;letter-spacing:.06em;
}
.tag-easy{color:#a8c9a4;border-color:rgba(94,143,98,.5);background:rgba(94,143,98,.14)}
.tag-med{color:#e4c07a;border-color:rgba(198,154,69,.5);background:rgba(198,154,69,.14)}
.tag-hard{color:#e7a29c;border-color:rgba(161,84,79,.55);background:rgba(161,84,79,.16)}
.grid3{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:680px){.grid3{grid-template-columns:repeat(3,1fr)}}
.level-card{
  position:relative;display:flex;flex-direction:column;gap:.35rem;padding:1.35rem;
  text-align:left;border:1px solid rgba(217,184,127,.16);border-radius:3px;
  background:linear-gradient(180deg, rgba(255,244,224,.035), rgba(255,244,224,0) 55%), #201913;
  color:#eee2cd;cursor:pointer;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.level-card:hover{transform:translateY(-4px);border-color:rgba(217,184,127,.6);box-shadow:0 30px 50px -35px #000}
.level-roman{font-family:'Cormorant Garamond',Georgia,serif;font-size:.76rem;letter-spacing:.34em;color:rgba(217,184,127,.55)}
.level-icon{font-size:1.55rem;line-height:1}
.level-name{font-family:'Cormorant Garamond','Noto Serif Thai',Georgia,serif;font-size:1.42rem;font-weight:600;color:#f5ead6}
.level-li{display:block;font-size:.85rem;line-height:1.7;color:#a9977f}
.level-best{margin-top:.6rem;font-size:.79rem;color:var(--gold)}
.bar{height:4px;width:100%;border-radius:999px;background:rgba(255,244,224,.08);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8a6534,var(--gold-bright));transition:width .4s ease}
.timer{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.08rem;font-weight:600;color:#e8dbc4}
.timer.is-low{color:#e08a83;animation:pulseSoft .6s ease-in-out infinite alternate}
@keyframes pulseSoft{to{opacity:.45}}
.note{
  margin-top:.6rem;padding:.6rem .85rem;border-left:2px solid var(--gold);
  background:rgba(217,184,127,.07);font-size:.9rem;line-height:1.65;color:#e3d6c1;
}
.opt{
  display:flex;align-items:center;gap:.7rem;padding:.85rem .95rem;text-align:left;width:100%;
  border:1px solid rgba(217,184,127,.15);border-radius:2px;background:#221b15;color:#eadfcd;
  font-size:.97rem;line-height:1.45;cursor:pointer;transition:all .18s ease;
}
.opt:hover:not(:disabled){border-color:rgba(217,184,127,.5);background:#2a2119}
.opt:disabled{cursor:default}
.opt-letter{
  display:inline-flex;align-items:center;justify-content:center;flex:none;width:1.55rem;height:1.55rem;
  border:1px solid rgba(217,184,127,.3);border-radius:50%;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:.92rem;color:rgba(217,184,127,.85);
}
.opt.is-right{background:#1d3123;border-color:#5e8f62;color:#d6e8d4}
.opt.is-wrong{background:#34201d;border-color:#a1544f;color:#f2d3cf}
.opt.is-gone{opacity:.18;text-decoration:line-through}
.aud{
  margin-top:.6rem;padding:.7rem .9rem;border:1px solid rgba(217,184,127,.12);
  background:rgba(255,244,224,.03);
}
.aud-row{display:flex;align-items:center;gap:.6rem;margin:.3rem 0;font-size:.85rem}
.aud-track{flex:1;height:10px;background:rgba(0,0,0,.4);overflow:hidden}
.aud-fill{height:100%;background:linear-gradient(90deg,#8b6b34,var(--gold-bright))}
.cw-wrap{display:flex;gap:1.75rem;flex-wrap:wrap;align-items:flex-start}
.cw-grid{display:grid;gap:2px;margin:0 auto;justify-content:center}
.cw-empty{width:100%;height:100%}
.cw-cell{
  position:relative;border-radius:2px;background:#f6efdf;
  box-shadow:inset 0 0 0 1px rgba(36,26,16,.08);
}
.cw-cell input{
  width:100%;height:100%;border:0;background:transparent;border-radius:2px;padding:0;
  text-align:center;text-transform:uppercase;
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;color:#241a10;
  outline:none;caret-color:transparent;
}
.cw-cell .num{
  position:absolute;top:1px;left:2px;line-height:1;font-weight:700;color:#8a7350;pointer-events:none;
}
.cw-cell.is-given{background:#e9d9b6}
.cw-cell.is-given input{color:#8a6430}
.cw-cell.is-hl{background:#fbeec7}
.cw-cell.is-cur{background:#f1d79a}
.cw-cell.is-ok{background:#cfe4cd}
.cw-cell.is-bad{background:#f0c9c5}
.cw-cell.is-rev input{color:#7a4fd6}
.clue-item{
  padding:.35rem .55rem;border-radius:2px;cursor:pointer;font-size:.88rem;line-height:1.55;
  color:#d9cbb6;transition:background .18s ease;
}
.clue-item:hover{background:rgba(217,184,127,.07)}
.clue-item.is-act{background:rgba(217,184,127,.15);color:#f7ecd8}
.clue-item.is-done{text-decoration:line-through;opacity:.45}
.clue-len{font-size:.78em;color:#8d7d68}
.portrait{
  position:relative;width:232px;max-width:100%;aspect-ratio:3/4;
  border:1px solid rgba(217,184,127,.45);background:#221b15;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.portrait::after{content:"";position:absolute;inset:4px;border:1px solid rgba(217,184,127,.18);pointer-events:none}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:top;transition:filter .7s ease}
.portrait img.is-blur{filter:blur(14px) grayscale(1)}
.slots{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:center}
.slot{
  display:inline-flex;align-items:center;justify-content:center;width:44px;height:54px;border-radius:2px;
  border:1px solid rgba(217,184,127,.28);background:#171210;color:#f0e4cf;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem;font-weight:700;
  text-transform:uppercase;padding:0;caret-color:transparent;text-align:center;
  transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.slot:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,184,127,.16)}
.slot.is-given{background:rgba(217,184,127,.14);border-color:rgba(217,184,127,.45);color:var(--gold-bright)}
.slot.is-hit{background:#1d3123;border-color:#5e8f62;color:#d6e8d4}
.slot.is-near{background:#33280f;border-color:#c69a45;color:#f0d8a8}
.slot.is-miss{background:#34201d;border-color:#a1544f;color:#f2d3cf}
.slot.is-ans{background:#241d16;border-color:rgba(255,244,224,.25);color:#c9bba6}
.dash{align-self:center;color:#8d7d68;font-size:1.35rem}
.field{
  min-width:0;flex:1;border:1px solid rgba(217,184,127,.28);background:#171210;
  padding:.5rem .7rem;font-size:.88rem;color:#f0e4cf;outline:none;border-radius:2px;
}
.field:focus{border-color:#d9b87f}
.fade-up{animation:fadeUp .42s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.shake{animation:shakeIt .36s ease}
@keyframes shakeIt{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:640px){.slot{width:32px;height:42px;font-size:1.15rem}}

/* ---------------- helpers ---------------- */
function shuffle(a){var o=a.slice();for(var i=o.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=o[i];o[i]=o[j];o[j]=t;}return o;}
function rand(a,b){return a+Math.random()*(b-a);}
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function letter(i){return String.fromCharCode(65+i);}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\u0E47-\u0E4C]/g,'').replace(/[^a-z\u0E01-\u0E3A\u0E40-\u0E46]/g,'');}
function getBest(k){try{var v=localStorage.getItem('cmg_'+k);return v===null?null:JSON.parse(v);}catch(e){return null;}}
function setBest(k,v,lower){var b=getBest(k);if(b===null||(lower?v<b:v>b)){try{localStorage.setItem('cmg_'+k,JSON.stringify(v));}catch(e){}return true;}return false;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function q(id){return document.getElementById(id);}
function all(node,sel){return Array.prototype.slice.call(node.querySelectorAll(sel));}
function rule(){return '<div class="rule"><span></span></div>';}

var QD={
  easy:['ศัพท์พื้นฐาน','8 ข้อ · 3 ตัวเลือก','ไม่จับเวลา','ตัวช่วยอย่างละ 2 ครั้ง'],

  hard:['ศัพท์ระดับกลาง–สูง','12 ข้อ · ตัวเลือกหมวดเดียวกัน','จับเวลาข้อละ 15 วินาที','ไม่มีตัวช่วยเปลี่ยนข้อ']
};
var Q=null;

function quizBests(){
  var o={};
  ['easy','med','hard'].forEach(function(k){
    var b=getBest('quiz_'+k);
    o[k]=b===null?null:b+' / '+QZ[k].n;
  });
  return o;
}
function makeQuestion(term,cfg){
  var others=TERMS.filter(function(x){return x!==term&&x.m!==term.m;});
  var distractors=cfg.same
    ? shuffle(others.filter(function(x){return x.c===term.c;}))
    : shuffle(others.filter(cfg.pool));
  if(distractors.length<cfg.opts-1){
    distractors=distractors.concat(shuffle(others.filter(function(x){return distractors.indexOf(x)<0;})));
  }
  return {t:term,rev:Math.random()<.5,opts:shuffle([term].concat(distractors.slice(0,cfg.opts-1))),gone:[],usedL:[]};
}
function quizStart(level){
  var cfg=QZ[level];
  var pool=shuffle(TERMS.filter(cfg.pool));
  Q={level:level,cfg:cfg,pool:pool,idx:0,score:0,life:Object.assign({},cfg.life),swapIdx:cfg.n,
     cur:makeQuestion(pool[0],cfg),notes:[],picked:null,left:cfg.time||0,finished:false,record:false,tick:null,anim:true};
  quizView();
}
function quizView(){
  var view=q('view-quiz');
  if(!Q||!Q.cfg){
    view.innerHTML=pickerHtml('เกมที่หนึ่ง · The Vocabulary','ทายศัพท์ดนตรีคลาสสิก',QD,quizBests());
    bindLevels(view,quizStart);
    return;
  }
  if(Q.finished){
    view.innerHTML=quizResultHtml();
    bindQuizResult(view);
    return;
  }
  view.innerHTML=quizQuestionHtml();
  bindQuiz(view);
  quizTick();
}
function quizQuestionHtml(){
  var c=Q.cur,cfg=Q.cfg,term=c.t;
  var prompt=c.rev
    ? '<p class="small gold-text mt4">คำนี้หมายถึงอะไร?</p><div class="term">'+esc(term.d)+'</div>'
    : '<p class="small gold-text mt4">คำศัพท์ใดตรงกับความหมายนี้?</p><div class="display-title" style="font-size:1.3rem">'+esc(term.m)+'</div>';

  var opts=c.opts.map(function(o,i){
    var cls='opt';
    if(c.gone.indexOf(i)>=0) cls+=' is-gone';
    if(Q.picked!==null){
      if(o===term) cls+=' is-right';
      else if(i===Q.picked) cls+=' is-wrong';
    }
    var txt=c.rev?esc(o.m):esc(o.d);
    return '<button class="'+cls+'" data-opt="'+i+'"'+(Q.picked!==null||c.gone.indexOf(i)>=0?' disabled':'')+'>'+
      '<span class="opt-letter">'+letter(i)+'</span><span>'+txt+'</span></button>';
  }).join('');

  var lifeBtns=Object.keys(LIFE).map(function(k){
    var n=Q.life[k];
    if(!n&&n!==0) return '';
    var used=c.usedL.indexOf(k)>=0;
    return '<button class="btn btn-ghost btn-sm" data-life="'+k+'"'+(Q.picked!==null||n<=0||used?' disabled':'')+'>'+LIFE[k]+' ('+n+')</button>';
  }).join('');

  var anim=Q.anim?' fade-up':'';
  Q.anim=false;
  return '<section class="ornate-panel'+anim+' panel-pad">'+
    '<div class="between">'+levelTag(Q.level)+
      '<span class="small muted">ข้อ '+(Q.idx+1)+' / '+cfg.n+' · คะแนน '+Q.score+'</span>'+
      '<span id="quiz-timer" class="'+(cfg.time&&Q.left<=5&&Q.picked===null?'timer is-low':'timer')+'">'+(cfg.time?'⏱ '+fmt(Q.left):'⏱ ไม่จับเวลา')+'</span>'+
      '<button class="btn btn-ghost btn-sm" data-menu="1">↩ เปลี่ยนระดับ</button>'+
    '</div>'+
    '<div class="bar mt3"><span style="width:'+((Q.idx/cfg.n)*100)+'%"></span></div>'+
    prompt+
    '<div class="mt4 stack">'+opts+'</div>'+
    '<div class="row mt4">'+lifeBtns+'</div>'+
    quizNotesHtml()+quizFeedbackHtml()+
  '</section>';
}
function quizNotesHtml(){
  return Q.notes.map(function(n){
    if(n.kind==='aud'){
      var rows=n.rows.map(function(r){
        return '<div class="aud-row"><b>'+r.label+'</b><div class="aud-track">'+
          '<div class="aud-fill" style="width:'+r.value+'%"></div></div><span>'+r.value+'%</span></div>';
      }).join('');
      return '<div class="aud">'+rows+(n.warn?'<p class="small muted">⚠️ ผู้ชมอาจเดาผิดได้ในระดับยาก</p>':'')+'</div>';
    }
    return '<div class="note">'+n.html+'</div>';
  }).join('');
}
function quizFeedbackHtml(){
  if(Q.picked===null) return '';
  var c=Q.cur,ok=c.opts[Q.picked]===c.t;
  return '<div class="fade-up mt5">'+
    '<p class="'+(ok?'right-text':'wrong-text')+'">'+(ok?'✅ ถูกต้อง!':'❌ ยังไม่ถูก')+'</p>'+
    '<p class="display-title mt1" style="font-size:1.2rem">'+esc(c.t.d)+
      ' <span class="muted" style="font-size:.85rem">— '+esc(c.t.m)+'</span></p>'+
    '<div class="mt4"><button class="btn btn-gold" data-next="1">'+
      (Q.idx+1>=Q.cfg.n?'ดูผลคะแนน 🏆':'ข้อต่อไป →')+'</button></div></div>';
}
function bindQuiz(view){
  all(view,'[data-opt]').forEach(function(btn){
    btn.onclick=function(){ quizAnswer(+btn.getAttribute('data-opt')); };
  });
  all(view,'[data-life]').forEach(function(btn){
    btn.onclick=function(){ quizLife(btn.getAttribute('data-life')); };
  });
  all(view,'[data-next]').forEach(function(btn){ btn.onclick=quizNext; });
  all(view,'[data-menu]').forEach(function(btn){
    btn.onclick=function(){ Q=null; quizView(); };
  });
}
function quizTick(){
  if(!Q||!Q.cfg||Q.finished) return;
  if(Q.tick){ clearTimeout(Q.tick); Q.tick=null; }
  if(!Q.cfg.time||Q.picked!==null) return;
  if(Q.left<=0){ quizAnswer(-1); return; }
  Q.tick=setTimeout(function(){
    if(!Q||Q.finished||Q.picked!==null) return;
    Q.left--;
    if(Q.left<=0){ quizAnswer(-1); return; }
    var t=q('quiz-timer');
    if(t){
      t.textContent='⏱ '+fmt(Q.left);
      t.className=Q.left<=5?'timer is-low':'timer';
    }
    quizTick();
  },1000);
}
function quizAnswer(i){
  if(!Q||Q.picked!==null) return;
  if(i>=0&&Q.cur.gone.indexOf(i)>=0) return;
  Q.picked=i;
  if(i>=0&&Q.cur.opts[i]===Q.cur.t) Q.score++;
  quizView();
}
function quizNext(){
  if(Q.idx+1>=Q.cfg.n){
    Q.record=setBest('quiz_'+Q.level,Q.score)&&Q.score>0;
    Q.finished=true;
    quizView();
    return;
  }
  Q.idx++;
  Q.cur=makeQuestion(Q.pool[Q.idx],Q.cfg);
  Q.notes=[];Q.picked=null;Q.left=Q.cfg.time||0;Q.anim=true;
  quizView();
}
function quizLife(kind){
  if(!Q||Q.picked!==null||!Q.life[kind]) return;
  var c=Q.cur,cfg=Q.cfg;
  function wrongIdx(){
    return c.opts.map(function(_,i){return i;}).filter(function(i){return c.opts[i]!==c.t&&c.gone.indexOf(i)<0;});
  }
  function hide(i){ if(c.gone.indexOf(i)<0) c.gone.push(i); }

  if(c.usedL.indexOf(kind)>=0){
    Q.notes.push({html:'ใช้ตัวช่วยนี้กับข้อนี้ไปแล้ว ลองตัวช่วยอื่นดูนะ'});
    quizView(); return;
  }
  if(kind==='swap'){
    if(Q.swapIdx>=Q.pool.length){
      Q.notes.push({html:'ไม่มีคำศัพท์เหลือให้เปลี่ยนแล้ว'});
      quizView(); return;
    }
    Q.life.swap--;Q.swapIdx++;
    Q.cur=makeQuestion(Q.pool[Q.swapIdx],cfg);
    Q.notes=[];Q.picked=null;Q.left=cfg.time||0;Q.anim=true;
    quizView(); return;
  }
  if(kind==='ff'){
    var wrong=wrongIdx();
    if(wrong.length<=1){
      Q.notes.push({html:'เหลือตัวเลือกน้อยแล้ว ใช้ตัวช่วยนี้ไม่ได้'});
      quizView(); return;
    }
    shuffle(wrong).slice(0,Math.min(cfg.opts===3?1:2,wrong.length-1)).forEach(hide);
    Q.notes.push({html:'✂️ ตัดตัวเลือกที่ผิดออกให้แล้ว!'});
  }
  if(kind==='aud'){
    var visible=c.opts.map(function(_,i){return i;}).filter(function(i){return c.gone.indexOf(i)<0;});
    var correctIdx=c.opts.indexOf(c.t);
    var chance=rand(cfg.aud[0],cfg.aud[1]);
    if(visible.length===2) chance=Math.min(.9,chance+.15);
    var others=visible.filter(function(i){return i!==correctIdx;});
    var weights=others.map(function(){return Math.random()+.2;});
    var total=weights.reduce(function(a,b){return a+b;},0)||1;
    var share={};
    share[correctIdx]=chance;
    others.forEach(function(i,j){ share[i]=((1-chance)*weights[j])/total; });
    if(Q.level==='hard'&&Math.random()<.25&&others.length){
      var sw=others[Math.floor(Math.random()*others.length)];
      var tmp=share[correctIdx];share[correctIdx]=share[sw];share[sw]=tmp;
    }
    var rounded={},sum=0;
    visible.forEach(function(i){ rounded[i]=Math.round(share[i]*100); sum+=rounded[i]; });
    rounded[visible[0]]+=100-sum;
    Q.notes.push({kind:'aud',rows:visible.map(function(i){return {label:letter(i),value:rounded[i]};}),warn:Q.level==='hard'});
  }
  if(kind==='hint'){
    var html='💡 หมวด: <b>'+CAT[c.t.c]+'</b>';
    if(c.rev){
      html+=' · คำตอบขึ้นต้นด้วย <b class="gold-text">"'+c.t.w[0]+'"</b> มี <b>'+c.t.w.length+'</b> ตัวอักษร';
    } else {
      var rest=wrongIdx();
      if(rest.length>1){
        var removed=rest[Math.floor(Math.random()*rest.length)];
        hide(removed);
        html+=' · และตัดตัวเลือกผิดออกให้ 1 ข้อ ('+letter(removed)+')';
      }
    }
    Q.notes.push({html:html});
  }
  c.usedL.push(kind);
  Q.life[kind]--;
  quizView();
}
function quizResultHtml(){
  var pct=Q.score/Q.cfg.n;
  var msg=pct>=.9?'🏆 ยอดเยี่ยมมาก!':pct>=.7?'🎻 เก่งมาก!':pct>=.4?'🎶 พอใช้ได้ ลองอีกครั้งนะ':'📖 ทบทวนศัพท์อีกนิดนะ';
  return '<section class="ornate-panel fade-up panel-pad center">'+levelTag(Q.level)+
    '<p class="eyebrow mt7">คะแนนรวม</p>'+
    '<p class="display-title mt2" style="font-size:3.2rem"><span class="gold-text">'+Q.score+
      '</span><span class="muted" style="font-size:1.4rem"> / '+Q.cfg.n+'</span></p>'+rule()+
    '<p>'+msg+'</p>'+(Q.record?'<p class="small gold-text mt2">🏆 สถิติใหม่!</p>':'')+
    '<div class="row mt7" style="justify-content:center">'+
      '<button class="btn btn-gold" data-again="1">🔄 เล่นอีกครั้ง</button>'+
      '<button class="btn btn-ghost" data-menu="1">เปลี่ยนระดับ</button></div></section>';
}
function bindQuizResult(view){
  all(view,'[data-again]').forEach(function(btn){ btn.onclick=function(){ quizStart(Q.level); }; });
  all(view,'[data-menu]').forEach(function(btn){ btn.onclick=function(){ Q=null; quizView(); }; });
}

/* ---------------- CROSSWORD ---------------- */
var CWD={
  easy:['ศัพท์พื้นฐาน 6 คำ','มีตัวอักษรแรกของทุกคำให้','บอกจำนวนตัวอักษร','เฉลยรายคำได้ไม่จำกัด'],
  med:['ศัพท์พื้นฐาน + ระดับกลาง 9 คำ','บอกจำนวนตัวอักษร','เฉลยรายคำได้ 3 ครั้ง'],
  hard:['ศัพท์ระดับกลาง–สูง 12 คำ','ไม่บอกจำนวนตัวอักษร','เฉลยรายคำได้ 1 ครั้ง']
};
var MAX_SIZE=15;
var CW=null;

function ckey(r,c){return r+','+c;}
function cwBests(){
  var o={};
  ['easy','med','hard'].forEach(function(k){
    var b=getBest('cw_'+k);
    o[k]=b===null?null:'⏱ '+fmt(b);
  });
  return o;
}
function cwTryBuild(pool,target){
  var candidates=shuffle(pool).slice(0,target+10).sort(function(a,b){return b.w.length-a.w.length;});
  var first=candidates.shift();
  var rest=shuffle(candidates);
  var grid=new Map(),placed=[];
  function step(dir){return dir==='A'?[0,1]:[1,0];}
  function put(term,r,c,dir){
    var d=step(dir);
    for(var i=0;i<term.w.length;i++){
      var k=ckey(r+d[0]*i,c+d[1]*i);
      if(!grid.has(k)) grid.set(k,{ch:term.w[i],dirs:new Set()});
      grid.get(k).dirs.add(dir);
    }
    placed.push({w:term.w,d:term.d,m:term.m,c:term.c,r:r,col:c,dir:dir});
  }
  function fits(word,r,c,dir){
    var d=step(dir);
    if(grid.has(ckey(r-d[0],c-d[1]))||grid.has(ckey(r+d[0]*word.length,c+d[1]*word.length))) return false;
    var crosses=0;
    for(var i=0;i<word.length;i++){
      var rr=r+d[0]*i,cc=c+d[1]*i;
      var cell=grid.get(ckey(rr,cc));
      if(cell){
        if(cell.ch!==word[i]||cell.dirs.has(dir)) return false;
        crosses++;
      } else if(dir==='A'){
        if(grid.has(ckey(rr-1,cc))||grid.has(ckey(rr+1,cc))) return false;
      } else if(grid.has(ckey(rr,cc-1))||grid.has(ckey(rr,cc+1))) return false;
    }
    if(!crosses) return false;
    var minR=r,maxR=r+d[0]*(word.length-1),minC=c,maxC=c+d[1]*(word.length-1);
    placed.forEach(function(p){
      var pd=step(p.dir);
      minR=Math.min(minR,p.r);
      minC=Math.min(minC,p.col);
      maxR=Math.max(maxR,p.r+pd[0]*(p.w.length-1));
      maxC=Math.max(maxC,p.col+pd[1]*(p.w.length-1));
    });
    return maxR-minR+1<=MAX_SIZE&&maxC-minC+1<=MAX_SIZE;
  }
  put(first,0,0,Math.random()<.5?'A':'D');
  for(var t=0;t<rest.length;t++){
    if(placed.length>=target) break;
    var term=rest[t],spots=[];
    placed.forEach(function(p){
      var nextDir=p.dir==='A'?'D':'A';
      for(var i=0;i<p.w.length;i++){
        for(var j=0;j<term.w.length;j++){
          if(p.w[i]!==term.w[j]) continue;
          var r=p.dir==='A'?p.r-j:p.r+i;
          var c=p.dir==='A'?p.col+i:p.col-j;
          if(fits(term.w,r,c,nextDir)) spots.push([r,c,nextDir]);
        }
      }
    });
    if(spots.length){
      var spot=spots[Math.floor(Math.random()*spots.length)];
      put(term,spot[0],spot[1],spot[2]);
    }
  }
  return placed;
}
function cwBuild(level){
  var cfg=CWS[level];
  var pool=TERMS.filter(function(t){return cfg.pool(t)&&t.w.length>=4&&t.w.length<=11;});
  var best=[];
  for(var a=0;a<150&&best.length<cfg.n;a++){
    var placed=cwTryBuild(pool,cfg.n);
    if(placed.length>best.length) best=placed;
  }
  if(!best.length) return null;
  var minR=Math.min.apply(null,best.map(function(p){return p.r;}));
  var minC=Math.min.apply(null,best.map(function(p){return p.col;}));
  var words=best.map(function(p){
    var o={};
    Object.keys(p).forEach(function(k){o[k]=p[k];});
    o.r=p.r-minR;
    o.col=p.col-minC;
    return o;
  });
  var rows=Math.max.apply(null,words.map(function(p){return p.r+(p.dir==='D'?p.w.length:1);}));
  var cols=Math.max.apply(null,words.map(function(p){return p.col+(p.dir==='A'?p.w.length:1);}));
  var startKeys=[];
  words.forEach(function(p){
    var k=ckey(p.r,p.col);
    if(startKeys.indexOf(k)<0) startKeys.push(k);
  });
  startKeys.sort(function(x,y){
    var a1=x.split(',').map(Number),b1=y.split(',').map(Number);
    return a1[0]-b1[0]||a1[1]-b1[1];
  });
  var nums=new Map();
  startKeys.forEach(function(k,i){ nums.set(k,i+1); });
  words.forEach(function(p){ p.num=nums.get(ckey(p.r,p.col)); });
  var cells=new Map();
  words.forEach(function(p,idx){
    var d=p.dir==='A'?[0,1]:[1,0];
    for(var i=0;i<p.w.length;i++){
      var k=ckey(p.r+d[0]*i,p.col+d[1]*i);
      if(!cells.has(k)) cells.set(k,{ch:p.w[i],A:null,D:null,given:false});
      cells.get(k)[p.dir]=idx;
    }
  });
  if(cfg.given){
    nums.forEach(function(_,k){
      var cell=cells.get(k);
      if(cell) cell.given=true;
    });
  }
  return {level:level,cfg:cfg,words:words,rows:rows,cols:cols,cells:cells,nums:nums};
}
function cwWordCells(word){
  var d=word.dir==='A'?[0,1]:[1,0];
  var out=[];
  for(var i=0;i<word.w.length;i++) out.push([word.r+d[0]*i,word.col+d[1]*i]);
  return out;
}
function cwStart(level){
  var puzzle=cwBuild(level);
  if(!puzzle) return;
  if(CW&&CW.timer) clearInterval(CW.timer);
  CW={level:level,puzzle:puzzle,entries:{},marks:{},revealed:{},active:null,dir:'A',sec:0,
      done:false,cheated:false,revealLeft:CWS[level].reveal,result:null,timer:null};
  cwView();
  CW.timer=setInterval(function(){
    if(!CW||!CW.puzzle||CW.done) return;
    CW.sec++;
    var t=q('cw-timer');
    if(t) t.textContent='⏱ '+fmt(CW.sec);
  },1000);
}
function cwView(){
  var view=q('view-crossword');
  if(!CW||!CW.puzzle){
    view.innerHTML=pickerHtml('เกมที่สอง · The Puzzle','อักษรไขว้ศัพท์ดนตรี',CWD,cwBests());
    bindLevels(view,cwStart);
    return;
  }
  view.innerHTML=cwHtml();
  bindCw(view);
}
function cwWordOk(word){
  var p=CW.puzzle;
  return cwWordCells(word).every(function(pos,i){
    var cell=p.cells.get(ckey(pos[0],pos[1]));
    var val=cell.given?cell.ch:(CW.entries[ckey(pos[0],pos[1])]||'');
    return val===word.w[i];
  });
}
function cwDoneWords(){
  return CW.puzzle.words.map(function(w,i){return {w:w,i:i};})
    .filter(function(x){return cwWordOk(x.w);})
    .map(function(x){return x.i;});
}
function cwActiveIndex(){
  if(!CW.active) return null;
  var cell=CW.puzzle.cells.get(ckey(CW.active[0],CW.active[1]));
  if(!cell) return null;
  return cell[CW.dir];
}
function cwGridHtml(){
  var p=CW.puzzle;
  var avail=Math.min(window.innerWidth-72,560);
  var cs=Math.max(20,Math.min(34,Math.floor(avail/p.cols)));
  var fs=Math.round(cs*.55),nfs=Math.round(cs*.26);
  var activeWord=cwActiveIndex();
  var hl={};
  if(activeWord!==null&&activeWord!==undefined){
    cwWordCells(p.words[activeWord]).forEach(function(pos){ hl[ckey(pos[0],pos[1])]=true; });
  }
  var html='<div class="cw-grid" id="cw-grid" style="grid-template-columns:repeat('+p.cols+','+cs+'px)">';
  for(var r=0;r<p.rows;r++){
    for(var c=0;c<p.cols;c++){
      var k=ckey(r,c),cell=p.cells.get(k);
      if(!cell){
        html+='<div class="cw-empty" style="width:'+cs+'px;height:'+cs+'px"></div>';
        continue;
      }
      var val=cell.given?cell.ch:(CW.entries[k]||'');
      var cls='cw-cell';
      if(cell.given) cls+=' is-given';
      if(hl[k]) cls+=' is-hl';
      if(CW.revealed[k]) cls+=' is-rev';
      if(CW.marks[k]==='ok') cls+=' is-ok';
      if(CW.marks[k]==='bad') cls+=' is-bad';
      if(CW.active&&CW.active[0]===r&&CW.active[1]===c) cls+=' is-cur';
      var numHtml=p.nums.has(k)?'<span class="num" style="font-size:'+nfs+'px">'+p.nums.get(k)+'</span>':'';
      var input=cell.given
        ? '<input readonly value="'+cell.ch+'" style="font-size:'+fs+'px">'
        : '<input maxlength="1" data-r="'+r+'" data-c="'+c+'" value="'+val+'" style="font-size:'+fs+'px" autocomplete="off" spellcheck="false">';
      html+='<div class="'+cls+'" style="width:'+cs+'px;height:'+cs+'px">'+numHtml+input+'</div>';
    }
  }
  return html+'</div>';
}
function cwCluesHtml(){
  var p=CW.puzzle;
  var activeIdx=cwActiveIndex();
  var solved=cwDoneWords();
  function list(dir,title){
    var items=p.words.map(function(w,i){return {w:w,i:i};})
      .filter(function(x){return x.w.dir===dir;})
      .sort(function(a,b){return a.w.num-b.w.num;});
    return '<div><h3 class="display-title" style="font-size:1rem">'+title+'</h3>'+
      items.map(function(x){
        var cls='clue-item';
        if(activeIdx===x.i) cls+=' is-act';
        if(solved.indexOf(x.i)>=0) cls+=' is-done';
        var len=p.cfg.len?' <span class="clue-len">('+x.w.w.length+')</span>':'';
        return '<div class="'+cls+'" data-clue="'+x.i+'"><b>'+x.w.num+'.</b> '+esc(x.w.m)+len+'</div>';
      }).join('')+'</div>';
  }
  return '<div style="min-width:210px;flex:1;display:flex;flex-direction:column;gap:18px">'+
    list('A','➡ แนวนอน')+list('D','⬇ แนวตั้ง')+'</div>';
}
function cwResultHtml(){
  if(!CW.result) return '';
  if(CW.result.type==='tip') return '<p class="note">'+CW.result.text+'</p>';
  if(CW.result.type==='progress'){
    var r=CW.result;
    return '<p class="note">ถูก '+r.right+' / '+r.total+' ช่อง · ถูกครบแล้ว '+r.solved+' / '+
      CW.puzzle.words.length+' คำ'+(r.filled<r.total?' · ยังว่างอยู่ '+(r.total-r.filled)+' ช่อง':'')+'</p>';
  }
  return '<div class="fade-up mt5" style="border-top:1px solid rgba(255,255,255,.06);padding-top:18px">'+
    '<p style="font-size:1.05rem">🎉 <b class="gold-text">'+
      (CW.result.clean?'ยอดเยี่ยม! ไขปริศนาครบทุกคำ':'ครบทุกคำแล้ว (มีการใช้เฉลย)')+
      '</b> · ใช้เวลา '+fmt(CW.sec)+'</p>'+
    (CW.result.record?'<p class="small gold-text mt1">🏆 สถิติใหม่!</p>':'')+
    '<div class="row mt4"><button class="btn btn-gold" data-cw="new">เล่นตารางใหม่</button>'+
      '<button class="btn btn-ghost" data-cw="menu">เปลี่ยนระดับ</button></div></div>';
}
function cwHtml(){
  var revealLabel=CW.revealLeft===Infinity?'ไม่จำกัด':'เหลือ '+CW.revealLeft;
  return '<section class="ornate-panel fade-up panel-pad">'+
    '<div class="between">'+levelTag(CW.level)+
      '<span class="timer" id="cw-timer">⏱ '+fmt(CW.sec)+'</span>'+
      '<button class="btn btn-ghost btn-sm" data-cw="menu">↩ เปลี่ยนระดับ</button></div>'+
    '<div class="row mt4">'+
      '<button class="btn btn-gold btn-sm" data-cw="check">✔ ตรวจคำตอบ</button>'+
      '<button class="btn btn-ghost btn-sm" data-cw="reveal"'+(CW.revealLeft<=0?' disabled':'')+'>💡 เฉลยคำที่เลือก ('+revealLabel+')</button>'+
      '<button class="btn btn-ghost btn-sm" data-cw="all">👀 เฉลยทั้งหมด</button>'+
      '<button class="btn btn-ghost btn-sm" data-cw="clear">🧽 ล้าง</button>'+
      '<button class="btn btn-ghost btn-sm" data-cw="new">🔄 ตารางใหม่</button></div>'+
    '<div class="cw-wrap mt5"><div class="mx" style="margin:0 auto">'+cwGridHtml()+'</div>'+
      cwCluesHtml()+'</div>'+
    cwResultHtml()+
    '<p class="small muted mt5">💡 คลิกช่องเดิมซ้ำเพื่อสลับแนวนอน/แนวตั้ง · ใช้ปุ่มลูกศรเลื่อนช่องได้</p>'+
  '</section>';
}
function cwInputAt(r,c){
  var grid=q('cw-grid');
  if(!grid) return null;
  return grid.querySelector('input[data-r="'+r+'"][data-c="'+c+'"]');
}
function cwActivate(r,c){
  var cell=CW.puzzle.cells.get(ckey(r,c));
  if(!cell) return;
  if(CW.active&&CW.active[0]===r&&CW.active[1]===c&&cell.A!==null&&cell.D!==null){
    CW.dir=CW.dir==='A'?'D':'A';
  } else if(cell[CW.dir]===null){
    CW.dir=cell.A!==null?'A':'D';
  }
  CW.active=[r,c];
  cwView();
  var input=cwInputAt(r,c);
  if(input) input.focus();
}
function cwPickClue(index){
  var word=CW.puzzle.words[index];
  CW.dir=word.dir;
  CW.active=[word.r,word.col];
  cwView();
  var input=cwInputAt(word.r,word.col);
  if(!input){
    var cells=cwWordCells(word);
    for(var i=0;i<cells.length;i++){
      input=cwInputAt(cells[i][0],cells[i][1]);
      if(input) break;
    }
  }
  if(input) input.focus();
}
function cwSetEntry(r,c,value){
  var k=ckey(r,c);
  CW.entries[k]=value;
  delete CW.marks[k];
  delete CW.revealed[k];
}
function cwMoveInWord(r,c,step){
  var dir=CW.dir;
  var dr=dir==='D'?1:0,dc=dir==='A'?1:0;
  var rr=r+dr*step,cc=c+dc*step;
  if(!CW.puzzle.cells.has(ckey(rr,cc))) return;
  var input=cwInputAt(rr,cc);
  if(input) input.focus();
}
function cwCheck(wasCheated){
  var p=CW.puzzle,marks={},filled=0,right=0;
  p.cells.forEach(function(cell,k){
    var val=cell.given?cell.ch:(CW.entries[k]||'');
    if(!val) return;
    filled++;
    if(val===cell.ch){
      right++;
      if(!cell.given) marks[k]='ok';
    } else {
      marks[k]='bad';
    }
  });
  CW.marks=marks;
  var solved=p.words.filter(cwWordOk).length;
  if(right===p.cells.size){
    var clean=!wasCheated&&!CW.cheated;
    var record=clean&&!CW.done&&setBest('cw_'+CW.level,CW.sec,true);
    CW.done=true;
    CW.result={type:'win',clean:clean,record:record};
    if(CW.timer){ clearInterval(CW.timer); CW.timer=null; }
  } else {
    CW.result={type:'progress',right:right,total:p.cells.size,filled:filled,solved:solved};
  }
  cwView();
}
function cwRevealWord(word){
  CW.cheated=true;
  cwWordCells(word).forEach(function(pos,i){
    var k=ckey(pos[0],pos[1]);
    CW.entries[k]=word.w[i];
    CW.revealed[k]=true;
  });
}
function cwRevealOne(){
  if(CW.done) return;
  if(!CW.active){
    CW.result={type:'tip',text:'👉 คลิกเลือกช่องหรือคำใบ้ก่อนนะ'};
    cwView(); return;
  }
  if(CW.revealLeft<=0){
    CW.result={type:'tip',text:'❌ ใช้สิทธิ์เฉลยรายคำหมดแล้ว'};
    cwView(); return;
  }
  var cell=CW.puzzle.cells.get(ckey(CW.active[0],CW.active[1]));
  var index=cell[CW.dir];
  if(index===null||index===undefined) return;
  cwRevealWord(CW.puzzle.words[index]);
  CW.revealLeft--;
  cwView();
}
function cwRevealAll(){
  if(CW.done) return;
  if(!window.confirm('เฉลยทั้งหมดเลยไหม? (จะไม่บันทึกสถิติเวลา)')) return;
  CW.puzzle.words.forEach(cwRevealWord);
  var full={};
  CW.puzzle.cells.forEach(function(cell,k){ full[k]=cell.ch; });
  var wasCheated=CW.cheated;
  CW.cheated=wasCheated;
  cwCheck(true);
}
function cwAction(action){
  if(action==='check') cwCheck(false);
  else if(action==='reveal') cwRevealOne();
  else if(action==='all') cwRevealAll();
  else if(action==='clear'){
    CW.entries={};CW.marks={};CW.revealed={};CW.result=null;
    cwView();
  }
  else if(action==='new') cwStart(CW.level);
  else if(action==='menu'){ CW=null; cwView(); }
}
function bindCw(view){
  all(view,'input[data-r]').forEach(function(input){
    input.addEventListener('click',function(){
      cwActivate(+input.getAttribute('data-r'),+input.getAttribute('data-c'));
    });
    input.addEventListener('input',function(){
      var r=+input.getAttribute('data-r'),c=+input.getAttribute('data-c');
      var ch=(input.value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(-1);
      input.value=ch;
      cwSetEntry(r,c,ch);
      if(ch) cwMoveInWord(r,c,1);
    });
    input.addEventListener('keydown',function(event){
      var r=+input.getAttribute('data-r'),c=+input.getAttribute('data-c');
      if(event.key==='Backspace'&&!input.value){
        event.preventDefault();
        cwMoveInWord(r,c,-1);
        return;
      }
      if(event.key==='ArrowRight'||event.key==='ArrowLeft'||event.key==='ArrowUp'||event.key==='ArrowDown'){
        event.preventDefault();
        var dr=event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0;
        var dc=event.key==='ArrowRight'?1:event.key==='ArrowLeft'?-1:0;
        var rr=r,cc=c;
        for(var i=0;i<MAX_SIZE;i++){
          rr+=dr;cc+=dc;
          if(!CW.puzzle.cells.has(ckey(rr,cc))) return;
          var next=cwInputAt(rr,cc);
          if(next){ next.focus(); return; }
        }
      }
      if(event.key==='Enter'){ event.preventDefault(); cwCheck(false); }
    });
  });
  all(view,'[data-clue]').forEach(function(node){
    node.onclick=function(){ cwPickClue(+node.getAttribute('data-clue')); };
  });
  all(view,'[data-cw]').forEach(function(btn){
    btn.onclick=function(){ cwAction(btn.getAttribute('data-cw')); };
  });
}

/* ---------------- COMPOSER ---------------- */
var CPD={
  easy:['นักประพันธ์ชื่อดัง 10 คน','เปิดตัวอักษรให้บางส่วน','บอกตัวที่ถูก 🟩 / มีในชื่อแต่ผิดตำแหน่ง 🟨','ตอบผิดได้ไม่จำกัด'],
  med:['สุ่มจากนักประพันธ์ 20 คน','เปิดให้แค่ตัวอักษรแรก','บอกเฉพาะตัวที่ถูกตำแหน่ง 🟩','ตอบได้ 5 ครั้ง · เห็นผลงาน 3 ชิ้น'],
  hard:['นักประพันธ์ที่ท้าทายขึ้น','ภาพเบลอ + เห็นผลงานแค่ 2 ชิ้น','ไม่บอกว่าตัวไหนถูก','ตอบได้ 3 ครั้ง']
};
var CP=null;
var imgCache={};

function cpBests(){
  var o={};
  ['easy','med','hard'].forEach(function(k){
    var b=getBest('cp_'+k);
    o[k]=b===null?null:b+' / '+(CP_ROUNDS*CP_BASE);
  });
  return o;
}
function cpSlots(composer,cfg){
  var list=[];
  for(var i=0;i<composer.key.length;i++){
    var ch=composer.key[i];
    if(ch==='-') continue;
    list.push({ch:ch,value:'',state:'open'});
  }
  if(cfg.pre==='first'){
    list[0].state='given';
  } else if(cfg.pre>0){
    list[0].state='given';
    var count=Math.max(1,Math.round(list.length*cfg.pre))-1;
    var pool=list.map(function(_,idx){return idx;}).slice(1);
    shuffle(pool).slice(0,count).forEach(function(idx){ list[idx].state='given'; });
  }
  list.forEach(function(slot){ if(slot.state==='given') slot.value=slot.ch; });
  return list;
}
function cpStart(level){
  var cfg=CPS[level];
  CP={level:level,cfg:cfg,order:shuffle(COMPOSERS.filter(cfg.pool)).slice(0,CP_ROUNDS),
      i:0,score:0,correctCount:0,finished:false,record:false};
  cpInitRound();
  cpView();
}
function cpInitRound(){
  var composer=CP.order[CP.i],cfg=CP.cfg;
  CP.slots=cpSlots(composer,cfg);
  CP.pts=CP_BASE;
  CP.tries=cfg.tries;
  CP.shownWorks=Math.min(cfg.works,composer.works.length);
  CP.hintsUsed=[];
  CP.notes=[];
  CP.done=false;
  CP.revealKind=null;
  CP.gained=0;
  CP.blurred=cfg.blur;
  CP.thai='';
  CP.img=imgCache[composer.wiki]||null;
  CP.imgError=false;
  cpLoadImage(composer);
}
function cpPaintPortrait(){
  var box=q('cp-portrait');
  if(!box||!CP) return;
  var composer=CP.order[CP.i];
  if(CP.img){
    box.innerHTML='<img src="'+CP.img+'" alt="'+esc(composer.full)+'"'+
      (CP.blurred&&!CP.done?' class="is-blur"':'')+'>';
  } else {
    box.innerHTML='<div class="center small muted" style="padding:0 12px">🎼<br>'+
      (CP.imgError?'ไม่พบภาพ (ต้องต่ออินเทอร์เน็ต)':'กำลังโหลดภาพ...')+'</div>';
  }
}
function cpLoadImage(composer){
  if(imgCache[composer.wiki]){
    cpPaintPortrait();
    return;
  }
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(composer.wiki))
    .then(function(res){return res.json();})
    .then(function(data){
      var url=(data.thumbnail&&data.thumbnail.source)||(data.originalimage&&data.originalimage.source)||'';
      if(!url){ throw new Error('no image'); }
      imgCache[composer.wiki]=url;
      if(!CP||CP.order[CP.i]!==composer) return;
      CP.img=url;
      cpPaintPortrait();
    })
    .catch(function(){
      if(!CP||CP.order[CP.i]!==composer) return;
      CP.imgError=true;
      cpPaintPortrait();
    });
}
function cpView(){
  var view=q('view-composer');
  if(!CP||!CP.level){
    view.innerHTML=pickerHtml('เกมที่สาม · The Composer','นักประพันธ์คนนี้คือใคร?',CPD,cpBests());
    bindLevels(view,cpStart);
    return;
  }
  if(CP.finished){
    view.innerHTML=cpResultHtml();
    bindCpResult(view);
    return;
  }
  view.innerHTML=cpHtml();
  bindCp(view);
  cpPaintPortrait();
}
function cpSlotsHtml(){
  var html='<div class="slots">';
  CP.slots.forEach(function(slot,idx){
    var cls='slot is-'+slot.state;
    if(slot.state==='given'||slot.state==='hit'||slot.state==='ans'){
      html+='<span class="'+cls+'">'+(slot.state==='ans'?slot.value:slot.ch)+'</span>';
    } else {
      html+='<input class="'+cls+'" data-slot="'+idx+'" maxlength="1" value="'+slot.value+
        '" autocomplete="off" spellcheck="false">';
    }
  });
  return html+'</div>';
}
function cpHints(){
  var list=[
    {id:'era',label:'🏛️ ยุค & สัญชาติ',cost:2},
    {id:'first',label:'👤 ชื่อต้น',cost:2},
    {id:'letter',label:'🔤 เปิด 1 ตัวอักษร',cost:1,repeat:true}
  ];
  if(CP.shownWorks<CP.order[CP.i].works.length) list.push({id:'works',label:'🎼 ดูผลงานเพิ่ม',cost:1});
  if(CP.blurred) list.push({id:'clear',label:'🖼️ ทำให้ภาพชัด',cost:2});
  return list;
}
function cpNotesHtml(){
  return CP.notes.map(function(note){ return '<div class="note">'+note+'</div>'; }).join('');
}
function cpHtml(){
  var composer=CP.order[CP.i];
  var hintBtns=cpHints().map(function(hint){
    var used=CP.hintsUsed.indexOf(hint.id)>=0;
    return '<button class="btn btn-ghost btn-sm" data-hint="'+hint.id+'"'+
      (CP.done||(!hint.repeat&&used)?' disabled':'')+'>'+hint.label+' (−'+hint.cost+')</button>';
  }).join('');
  var feedbackNote=CP.cfg.fb==='full'
    ? '🟩 ถูกตำแหน่ง · 🟨 มีในชื่อแต่ผิดตำแหน่ง · 🟥 ไม่มีในชื่อ'
    : CP.cfg.fb==='green' ? '🟩 ถูกตำแหน่ง · 🟥 ผิดตำแหน่ง' : '';

  return '<section class="ornate-panel fade-up panel-pad">'+
    '<div class="between">'+levelTag(CP.level)+
      '<span class="small muted">คนที่ '+(CP.i+1)+' / '+CP_ROUNDS+' · คะแนนรวม '+CP.score+'</span>'+
      '<button class="btn btn-ghost btn-sm" data-cp="menu">↩ เปลี่ยนระดับ</button></div>'+
    '<div class="bar mt3"><span style="width:'+((CP.i/CP_ROUNDS)*100)+'%"></span></div>'+
    '<div class="mt5" style="display:flex;flex-wrap:wrap;gap:24px">'+
      '<div style="margin:0 auto">'+
        '<div class="portrait" id="cp-portrait"></div>'+
        '<p class="small muted center mt2" style="letter-spacing:.14em;font-size:10px">'+
          (CP.blurred&&!CP.done?'ภาพเบลอ':'Portrait')+'</p>'+
      '</div>'+
      '<div style="min-width:240px;flex:1">'+
        '<h3 class="display-title" style="font-size:1.05rem">🎵 ผลงานเด่นของเขา</h3>'+
        '<ul style="margin-top:4px;font-size:.9rem;color:#c9bba6;list-style:none">'+
          composer.works.slice(0,CP.shownWorks).map(function(w){return '<li>· '+esc(w)+'</li>';}).join('')+
        '</ul>'+
        '<p class="small muted mt4">✍️ พิมพ์นามสกุลภาษาอังกฤษลงในช่อง แล้วกด Enter</p>'+
        '<div class="mt2">'+cpSlotsHtml()+'</div>'+
        (feedbackNote?'<p class="small muted mt2">'+feedbackNote+'</p>':'')+
        '<div class="row mt4">'+
          '<button class="btn btn-gold" data-cp="submit"'+(CP.done?' disabled':'')+'>✔ ตอบ</button>'+
          '<span class="small muted">คะแนนที่จะได้: <b class="gold-text">'+CP.pts+'</b>'+
            (CP.tries===Infinity?'':' · โอกาสตอบ: <b>'+CP.tries+'</b>')+'</span>'+
        '</div>'+
        '<div class="row mt3" style="flex-wrap:nowrap">'+
          '<input class="field" id="cp-thai" placeholder="หรือพิมพ์ชื่อภาษาไทย เช่น โมซาร์ท"'+
            (CP.done?' disabled':'')+' autocomplete="off">'+
          '<button class="btn btn-ghost" data-cp="thai"'+(CP.done?' disabled':'')+'>ตอบ</button>'+
        '</div>'+
        '<p class="small muted mt5">💡 ต้องการคำใบ้ไหม? (ไม่บังคับ แต่ใช้แล้วคะแนนจะลดลง)</p>'+
        '<div class="row mt2">'+hintBtns+'</div>'+
        cpNotesHtml()+
        (CP.done?cpRoundDoneHtml():'')+
        '<div class="mt4"><button class="btn btn-ghost btn-sm" data-cp="surrender"'+
          (CP.done?' disabled':'')+'>🏳️ ยอมแพ้ / ดูเฉลย</button></div>'+
      '</div>'+
    '</div></section>';
}
function cpRoundDoneHtml(){
  var composer=CP.order[CP.i];
  return '<div class="fade-up mt5" style="border-top:1px solid rgba(255,255,255,.06);padding-top:16px">'+
    '<p>'+(CP.revealKind==='ok'
      ? '✅ ถูกต้อง! ได้ <b class="gold-text">+'+CP.gained+'</b> คะแนน'
      : '🏳️ เฉลย:')+'</p>'+
    '<p class="display-title gold-text mt1" style="font-size:1.4rem">'+esc(composer.full)+'</p>'+
    '<p class="small muted">'+esc(composer.th)+' · '+esc(composer.nat)+' · '+esc(composer.yrs)+' · ยุค'+esc(composer.era)+'</p>'+
    '<div class="mt4"><button class="btn btn-gold" data-cp="next">'+
      (CP.i+1<CP.order.length?'คนต่อไป →':'ดูผลคะแนน 🏆')+'</button></div></div>';
}
function cpResultHtml(){
  var message=CP.correctCount>=8?'🎩 ผู้เชี่ยวชาญดนตรีคลาสสิก!'
    :CP.correctCount>=5?'🎻 เก่งมาก!':'🎶 ฟังเพลงคลาสสิกเพิ่มอีกนิดนะ';
  return '<section class="ornate-panel fade-up panel-pad center">'+levelTag(CP.level)+
    '<p class="eyebrow mt7">คะแนนรวม</p>'+
    '<p class="display-title mt2" style="font-size:3.2rem"><span class="gold-text">'+CP.score+
      '</span><span class="muted" style="font-size:1.4rem"> / '+(CP_ROUNDS*CP_BASE)+'</span></p>'+rule()+
    '<p style="font-size:1.05rem">ตอบถูก '+CP.correctCount+' จาก '+CP_ROUNDS+' คน '+message+'</p>'+
    (CP.record?'<p class="small gold-text mt2">🏆 สถิติใหม่!</p>':'')+
    '<div class="row mt7" style="justify-content:center">'+
      '<button class="btn btn-gold" data-again="1">🔄 เล่นอีกครั้ง</button>'+
      '<button class="btn btn-ghost" data-cp="menu">เปลี่ยนระดับ</button></div></section>';
}
function bindCpResult(view){
  all(view,'[data-again]').forEach(function(btn){ btn.onclick=function(){ cpStart(CP.level); }; });
  all(view,'[data-cp]').forEach(function(btn){
    btn.onclick=function(){ if(btn.getAttribute('data-cp')==='menu'){ CP=null; cpView(); } };
  });
}
function cpFocusNext(index){
  var view=q('view-composer');
  var inputs=all(view,'input[data-slot]');
  for(var i=0;i<inputs.length;i++){
    if(+inputs[i].getAttribute('data-slot')>index){ inputs[i].focus(); return; }
  }
}
function bindCp(view){
  all(view,'input[data-slot]').forEach(function(input){
    input.addEventListener('input',function(){
      var idx=+input.getAttribute('data-slot');
      var ch=(input.value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(-1);
      input.value=ch;
      CP.slots[idx].value=ch;
      if(ch) cpFocusNext(idx);
    });
    input.addEventListener('keydown',function(event){
      if(event.key==='Enter'){ event.preventDefault(); cpSubmit(); }
    });
  });
  var thai=view.querySelector('#cp-thai');
  if(thai){
    thai.value=CP.thai||'';
    thai.addEventListener('input',function(){ CP.thai=thai.value; });
    thai.addEventListener('keydown',function(event){
      if(event.key==='Enter'){ event.preventDefault(); cpSubmitThai(); }
    });
  }
  all(view,'[data-hint]').forEach(function(btn){
    btn.onclick=function(){ cpApplyHint(btn.getAttribute('data-hint')); };
  });
  all(view,'[data-cp]').forEach(function(btn){
    var action=btn.getAttribute('data-cp');
    btn.onclick=function(){
      if(action==='submit') cpSubmit();
      else if(action==='thai') cpSubmitThai();
      else if(action==='surrender') cpFinishRound(false);
      else if(action==='next') cpNext();
      else if(action==='menu'){ CP=null; cpView(); }
    };
  });
}
function cpAddNote(html){ CP.notes.push(html); }
function cpApplyHint(id){
  if(!CP||CP.done) return;
  var composer=CP.order[CP.i];
  if(id==='letter'){
    var editable=CP.slots.map(function(slot,index){return {slot:slot,index:index};})
      .filter(function(x){return x.slot.state==='open';});
    if(editable.length<=1){ cpView(); return; }
    var wrong=editable.filter(function(x){return x.slot.value!==x.slot.ch;});
    var pool=wrong.length>1?wrong:editable;
    var pick=pool[Math.floor(Math.random()*pool.length)];
    CP.slots[pick.index].value=pick.slot.ch;
    CP.slots[pick.index].state='given';
  }
  if(CP.hintsUsed.indexOf(id)>=0&&id!=='letter'){ cpView(); return; }
  if(id==='era') cpAddNote('🏛️ ยุค: <b>'+esc(composer.era)+'</b> · สัญชาติ: <b>'+esc(composer.nat)+'</b> · ช่วงชีวิต: <b>'+esc(composer.yrs)+'</b>');
  if(id==='first') cpAddNote('👤 ชื่อต้น: <b class="gold-text">'+esc(composer.full.split(' ').slice(0,-1).join(' '))+'</b> ...');
  if(id==='works'){ CP.shownWorks=composer.works.length; cpAddNote('🎼 เปิดผลงานทั้งหมดแล้ว'); }
  if(id==='clear'){ CP.blurred=false; cpAddNote('🖼️ ภาพชัดแล้ว!'); }
  CP.hintsUsed.push(id);
  CP.pts=Math.max(1,CP.pts-(id==='letter'?1:(id==='works'?1:2)));
  cpView();
}
function cpFinishRound(ok){
  if(!CP||CP.done) return;
  CP.done=true;
  CP.gained=ok?CP.pts:0;
  CP.revealKind=ok?'ok':'reveal';
  CP.score+=ok?CP.pts:0;
  if(ok) CP.correctCount++;
  CP.slots.forEach(function(slot){
    if(slot.state==='open'||slot.state==='near'||slot.state==='miss'){
      slot.value=slot.ch;
      slot.state=ok?'hit':'ans';
    } else {
      slot.value=slot.ch;
      if(ok) slot.state='hit';
    }
  });
  CP.shownWorks=CP.order[CP.i].works.length;
  CP.blurred=false;
  cpView();
}
function cpWrongGuess(){
  CP.pts=Math.max(1,CP.pts-1);
  var remaining=CP.tries===Infinity?Infinity:CP.tries-1;
  CP.tries=remaining;
  if(remaining!==Infinity&&remaining<=0){ cpFinishRound(false); return; }
  cpAddNote(remaining!==Infinity
    ? '❌ ยังไม่ถูก · เหลือโอกาสอีก <b>'+remaining+'</b> ครั้ง (−1 คะแนน)'
    : '❌ ยังไม่ถูก (−1 คะแนน)');
}
function cpSubmit(){
  if(!CP||CP.done) return;
  var empty=false,guess='',answer='';
  CP.slots.forEach(function(slot){
    if(!slot.value) empty=true;
    guess+=slot.value;
    answer+=slot.ch;
  });
  if(empty){ cpAddNote('✏️ กรอกตัวอักษรให้ครบทุกช่องก่อนนะ'); cpView(); return; }
  if(guess===answer){ cpFinishRound(true); return; }
  if(CP.cfg.fb!=='none'){
    var remain={};
    CP.slots.forEach(function(slot){
      if(slot.state==='open'&&slot.value!==slot.ch){ remain[slot.ch]=(remain[slot.ch]||0)+1; }
    });
    CP.slots.forEach(function(slot){
      if(slot.state!=='open') return;
      if(slot.value===slot.ch){ slot.state='hit'; return; }
      if(CP.cfg.fb==='full'&&remain[slot.value]>0){
        remain[slot.value]--;
        slot.state='near';
        return;
      }
      slot.state='miss';
    });
  }
  cpWrongGuess();
  cpView();
}
function cpSubmitThai(){
  if(!CP||CP.done) return;
  var composer=CP.order[CP.i];
  var guess=norm(CP.thai||'');
  if(!guess) return;
  var correct=[composer.th,composer.full].concat(composer.ans).some(function(answer){
    var value=norm(answer);
    return value===guess||(value.length>=3&&guess.indexOf(value)>=0);
  });
  CP.thai='';
  if(correct){ cpFinishRound(true); return; }
  cpWrongGuess();
  cpView();
}
function cpNext(){
  var nextIndex=CP.i+1;
  if(nextIndex>=CP.order.length){
    CP.record=setBest('cp_'+CP.level,CP.score)&&CP.score>0;
    CP.finished=true;
    cpView();
    return;
  }
  CP.i=nextIndex;
  cpInitRound();
  cpView();
}
